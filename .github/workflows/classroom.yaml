name: Autograding Tests

on:
  push:
    paths:
      - 'assignment.py'
      - 'test_assignment.py'
  workflow_dispatch:

permissions:
  checks: write
  actions: read
  contents: read

jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    if: github.actor != 'github-classroom[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install -r requirements.txt

      - name: Ex 1 - ReadNumbers
        id: ex1_read_numbers
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - ReadNumbers
          command: pytest test_assignment.py::test1_read_numbers
          timeout: 2
          max-score: 1

      - name: Ex 1 - Skips bad lines
        id: ex1_skips_bad_lines
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Skips bad lines
          command: pytest test_assignment.py::test1_skips_bad_lines
          timeout: 2
          max-score: 1

      - name: Ex 1 - Empty file
        id: ex1_empty_file
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - Empty file
          command: pytest test_assignment.py::test1_empty_file
          timeout: 2
          max-score: 1

      - name: Ex 1 - File not found
        id: ex1_file_not_found
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 1 - File not found
          command: pytest test_assignment.py::test1_file_not_found
          timeout: 2
          max-score: 1

      - name: Ex 2 - WriteScores
        id: ex2_write_scores
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - WriteScores
          command: pytest test_assignment.py::test2_write_scores
          timeout: 2
          max-score: 1

      - name: Ex 2 - Overwrites file
        id: ex2_overwrites_and_empty
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Overwrites file
          command: pytest test_assignment.py::test2_overwrites_and_empty
          timeout: 2
          max-score: 1

      - name: Ex 2 - Cannot write
        id: ex2_cannot_write
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 2 - Cannot write
          command: pytest test_assignment.py::test2_cannot_write
          timeout: 2
          max-score: 1

      - name: Ex 3 - ProcessResults grades
        id: ex3_grades
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - ProcessResults grades
          command: pytest test_assignment.py::test3_grades
          timeout: 2
          max-score: 1

      - name: Ex 3 - Invalid lines
        id: ex3_invalid_lines
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - Invalid lines
          command: pytest test_assignment.py::test3_invalid_lines
          timeout: 2
          max-score: 1

      - name: Ex 3 - File not found
        id: ex3_file_not_found
        uses: classroom-resources/autograding-command-grader@v1
        with:
          test-name: Ex 3 - File not found
          command: pytest test_assignment.py::test3_file_not_found
          timeout: 2
          max-score: 1

      - name: Autograding Reporter
        uses: classroom-resources/autograding-grading-reporter@v1
        env:
          EX1_READ_NUMBERS_RESULTS: "${{ steps.ex1_read_numbers.outputs.result }}"
          EX1_SKIPS_BAD_LINES_RESULTS: "${{ steps.ex1_skips_bad_lines.outputs.result }}"
          EX1_EMPTY_FILE_RESULTS: "${{ steps.ex1_empty_file.outputs.result }}"
          EX1_FILE_NOT_FOUND_RESULTS: "${{ steps.ex1_file_not_found.outputs.result }}"
          EX2_WRITE_SCORES_RESULTS: "${{ steps.ex2_write_scores.outputs.result }}"
          EX2_OVERWRITES_AND_EMPTY_RESULTS: "${{ steps.ex2_overwrites_and_empty.outputs.result }}"
          EX2_CANNOT_WRITE_RESULTS: "${{ steps.ex2_cannot_write.outputs.result }}"
          EX3_GRADES_RESULTS: "${{ steps.ex3_grades.outputs.result }}"
          EX3_INVALID_LINES_RESULTS: "${{ steps.ex3_invalid_lines.outputs.result }}"
          EX3_FILE_NOT_FOUND_RESULTS: "${{ steps.ex3_file_not_found.outputs.result }}"
        with:
          runners: ex1_read_numbers,ex1_skips_bad_lines,ex1_empty_file,ex1_file_not_found,ex2_write_scores,ex2_overwrites_and_empty,ex2_cannot_write,ex3_grades,ex3_invalid_lines,ex3_file_not_found
